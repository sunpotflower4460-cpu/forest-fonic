name: Collect Commons reference photos

on:
  push:
    branches:
      - references/commons-seed-20261101
      - references/world-and-forest-layout-20261101
    paths:
      - .github/workflows/collect-commons.yml
      - scripts/collect_commons.py
      - catalog/topics.json
      - catalog/exclusions.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-commons-reference
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'sunpotflower4460-cpu/forest-fonic'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image converter
        run: python -m pip install "Pillow>=11,<13"
      - name: Collect and build attributed gallery
        run: python scripts/collect_commons.py --max-total 420 --per-topic 3
      - name: Validate catalog and image checksums
        run: python scripts/collect_commons.py --verify
      - name: Commit collected reference photos
        run: |
          git config user.name "forest-fonic-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- assets catalog/images.json catalog/CREDITS.md gallery
          if ! git diff --cached --quiet; then
            git commit -m "assets: collect attributed Wikimedia Commons reference photos"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
